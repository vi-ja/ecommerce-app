<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AstraCart | Redirecting</title>
    <script>
      const path = window.location.pathname + window.location.search + window.location.hash;
      const search = new URLSearchParams({ p: path });
      window.location.replace(`./index.html?${search.toString()}`);
    </script>
  </head>
  <body></body>
</html>
