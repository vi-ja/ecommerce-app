<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AstraCart is a polished product catalog experience with routing, filtering, and cart management." />
    <title>AstraCart | Premium Catalog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/" data-route="/">AstraCart</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="/" data-route="/">Home</a>
          <a href="/products" data-route="/products">Products</a>
          <a href="/about" data-route="/about">About</a>
          <a href="/contact" data-route="/contact">Contact</a>
          <a class="cart-link" href="/cart" data-route="/cart">
            Cart <span class="cart-badge" data-cart-count>0</span>
          </a>
        </nav>
      </div>
    </header>

    <main id="app" class="container"></main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© 2026 AstraCart. Crafted for modern shoppers.</p>
      </div>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
